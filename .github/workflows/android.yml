name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_PRIVATE_KEY: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Optional: sign with your own key instead of the shared one in app/keystore (see README).
      - name: Use private signing key
        if: env.HAS_PRIVATE_KEY == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          {
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Run tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug and release APKs
        run: |
          ./gradlew assembleDebug assembleRelease
          cp app/build/outputs/apk/release/app-release.apk expense-tracker.apk

      - name: Verify the APKs
        run: |
          ls -l app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --print-certs expense-tracker.apk
          "$build_tools/aapt2" dump badging expense-tracker.apk | head -n 3

      - uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-apk
          path: expense-tracker.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  device-test:
    name: Upgrade from version 1 and walk through the APK on an emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The last version 1 commit, built with the same shared signing key, so
      # version 2 installs over it like an update from the release page would.
      - name: Build the version 1 APK
        run: |
          git worktree add "$RUNNER_TEMP/v1" af1b1ad
          (cd "$RUNNER_TEMP/v1" && ./gradlew --no-configuration-cache assembleRelease)
          cp "$RUNNER_TEMP/v1/app/build/outputs/apk/release/app-release.apk" v1.apk
          cp "$RUNNER_TEMP/v1/scripts/device_smoke_test.py" v1_walkthrough.py

      - uses: actions/download-artifact@v4
        with:
          name: expense-tracker-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          enable-hw-keyboard: true
          script: |
            python3 v1_walkthrough.py v1.apk device-screenshots/1-version-1
            python3 scripts/device_smoke_test.py expense-tracker.apk device-screenshots/2-version-2 --after-v1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-screenshots
          path: device-screenshots/
          if-no-files-found: ignore

  publish:
    name: Publish APK as a GitHub release
    needs: [build, device-test]
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: expense-tracker-apk

      - name: Replace the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<EOF
          Latest build of Expense Tracker (build ${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA::7}).

          **Install on your phone:** open this page on the phone, tap \`expense-tracker.apk\`, then allow your browser to install apps when Android asks.
          New builds install over the old one and keep your data.
          EOF
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest expense-tracker.apk \
            --title "Expense Tracker (latest build)" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
